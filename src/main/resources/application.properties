spring.application.name=gestor

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/arelu
spring.datasource.username=${DB_USERNAME:arelu}
spring.datasource.password=${DB_PASSWORD:arelu}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true